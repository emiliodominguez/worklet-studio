name: Verify
on:
    push:
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm install --global npm@12.1.0
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run check
            - run: npm run pack:check
